name: restore-keys proof (temporary)
on:
  push:
    branches: [ER-43963-restore-keys]
    paths: [.github/workflows/restore-keys-proof.yml]
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          enable-cache: true
          cache-dependency-glob: __tests__/fixtures/uv-project/uv.lock
          cache-suffix: seed
      - run: cd __tests__/fixtures/uv-project && uv sync 2>&1 | tee /tmp/sync.log; grep -E 'Prepared|Downloaded|Installed' /tmp/sync.log || true
  lock-changed-with-fallback:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "# changed" >> __tests__/fixtures/uv-project/uv.lock
      - uses: ./
        with:
          enable-cache: true
          cache-dependency-glob: __tests__/fixtures/uv-project/uv.lock
          cache-suffix: fallback
      - run: cd __tests__/fixtures/uv-project && uv sync 2>&1 | tee /tmp/sync.log; grep -E 'Prepared|Downloaded|Installed' /tmp/sync.log || true
  lock-changed-without-fallback:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "# changed" >> __tests__/fixtures/uv-project/uv.lock
      - uses: ./
        with:
          enable-cache: true
          restore-keys-fallback: "false"
          cache-dependency-glob: __tests__/fixtures/uv-project/uv.lock
          cache-suffix: nofallback
      - run: cd __tests__/fixtures/uv-project && uv sync 2>&1 | tee /tmp/sync.log; grep -E 'Prepared|Downloaded|Installed' /tmp/sync.log || true
